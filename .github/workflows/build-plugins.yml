name: Build LNReader plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: lnreader/lnreader-plugins
          ref: master
          path: upstream
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install upstream build tooling
        working-directory: upstream
        run: npm ci

      - name: Copy EatApplePies plugin into upstream tree
        run: |
          mkdir -p upstream/plugins/english
          cp plugins/english/eatapplepies.ts upstream/plugins/english/eatapplepies.ts

          mkdir -p upstream/public/static/src/en/eatapplepies
          cp plugins/english/eatapplepies.svg upstream/public/static/src/en/eatapplepies/icon.svg

      - name: Build plugin manifest
        working-directory: upstream
        run: |
          npm run build:compile
          npm run build:manifest

      - name: Fix EatApplePies URLs
        working-directory: upstream
        run: |
          sed -i 's#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/.js/src/plugins/english/eatapplepies.js#https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/.js/plugins/english/eatapplepies.js#g' .dist/plugins.json
          sed -i 's#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/public/static/src/en/eatapplepies/icon.svg#https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/public/static/src/en/eatapplepies/icon.svg#g' .dist/plugins.json

          sed -i 's#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/.js/src/plugins/english/eatapplepies.js#https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/.js/plugins/english/eatapplepies.js#g' .dist/plugins.min.json
          sed -i 's#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/public/static/src/en/eatapplepies/icon.svg#https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/public/static/src/en/eatapplepies/icon.svg#g' .dist/plugins.min.json

      - name: Publish generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd upstream

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git checkout --orphan publish
          git rm -rf . 2>/dev/null || true

          git add -f .js .dist public/static/src/en/eatapplepies

          git commit -m "Build EatApplePies plugin"

          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:refs/heads/plugins/v3.0.0 --force
