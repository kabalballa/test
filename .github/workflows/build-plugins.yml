name: Build LNReader plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-lnreader-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: lnreader/lnreader-plugins
          ref: master
          path: upstream
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install upstream build tooling
        working-directory: upstream
        run: npm ci

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Copy EatApplePies plugin into upstream tree
        run: |
          set -euo pipefail
          mkdir -p upstream/plugins/english
          EAP_SOURCE=$(find plugins/english -maxdepth 1 -type f -name 'eatapplepies*.ts' -print | sort | tail -n 1)
          test -n "$EAP_SOURCE"
          echo "Using EatApplePies source: $EAP_SOURCE"
          cp "$EAP_SOURCE" upstream/plugins/english/eatapplepies.ts
          mkdir -p upstream/public/static/src/en/eatapplepies
          test -f plugins/english/eatapplepies.svg
          convert plugins/english/eatapplepies.svg -background none -resize 512x512 upstream/public/static/src/en/eatapplepies/icon.png

      - name: Copy Sousaku plugin into upstream tree
        run: |
          set -euo pipefail
          mkdir -p upstream/plugins/english
          cp plugins/english/sousaku.ts upstream/plugins/english/sousaku.ts
          mkdir -p upstream/public/static/src/en/sousaku
          cp plugins/english/sousaku.svg upstream/public/static/src/en/sousaku/icon.svg

      - name: Copy Tseirp Translations plugin into upstream tree
        run: |
          set -euo pipefail
          mkdir -p upstream/plugins/english
          cp plugins/english/tseirptranslations.ts upstream/plugins/english/tseirptranslations.ts
          mkdir -p upstream/public/static/src/en/tseirptranslations
          cp plugins/english/tseirptranslations.svg upstream/public/static/src/en/tseirptranslations/icon.svg

      - name: Patch Sousaku direct chapter URLs
        working-directory: upstream
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("plugins/english/sousaku.ts")
          source = path.read_text(encoding="utf-8")
          source = source.replace("  version = '1.2.4';", "  version = '1.2.5';", 1)

          old_path = """  private toChapterPath(url: URL, chapterName: string): string {
              const target = new URL(url.href);
              target.searchParams.delete(CHAPTER_MARKER);
              target.searchParams.set(CHAPTER_MARKER, chapterName);
              return target.href;
            }"""
          new_path = """  private toChapterPath(url: URL, chapterName: string): string {
              const target = new URL(url.href);
              const sourcePath = target.pathname.toLowerCase();
              if (sourcePath.includes("/moto-sekai-ichi-chapter-")) {
                const match = chapterName.match(/(?:^|\\s)(\\d{1,4})([a-z]?)(?=\\s|$|[-:–—.])/i);
                if (match) {
                  const number = match[1].padStart(3, "0");
                  const suffix = match[2].toLowerCase();
                  const direct = new URL(this.site + "motto-sekai-ichi-i-no-sub-chara-ikusei-nikki/moto-sekai-ichi-" + number + suffix + "/");
                  direct.hash = target.hash;
                  return direct.href;
                }
              }
              target.searchParams.delete(CHAPTER_MARKER);
              target.searchParams.set(CHAPTER_MARKER, chapterName);
              return target.href;
            }"""
          if old_path not in source:
              raise SystemExit("Could not find the expected Sousaku toChapterPath method.")
          source = source.replace(old_path, new_path, 1)

          old_chapter = """    let result = '';
            if (fragment || requestedLabel) result = this.extractRequestedChapter($, element, requestedLabel, fragment, cleanUrl);
            if ((fragment || requestedLabel) && !result) result = '<p>Requested chapter could not be isolated.</p>';"""
          new_chapter = """    let result = '';
            const isSharedDatePost = /^\\/\\d{4}\\/\\d{2}\\/\\d{2}\\//.test(new URL(cleanUrl, this.site).pathname);
            if (fragment || (requestedLabel && isSharedDatePost)) result = this.extractRequestedChapter($, element, requestedLabel, fragment, cleanUrl);
            if ((fragment || (requestedLabel && isSharedDatePost)) && !result) result = '<p>Requested chapter could not be isolated.</p>';"""
          if old_chapter not in source:
              raise SystemExit("Could not find the expected Sousaku parseChapter block.")
          source = source.replace(old_chapter, new_chapter, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Build plugin manifest
        working-directory: upstream
        run: |
          npm run build:compile
          npm run build:manifest

      - name: Fix plugin URLs
        working-directory: upstream
        run: |
          set -euo pipefail
          EAP_JS_URL='https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/.js/plugins/english/eatapplepies.js'
          EAP_ICON_URL='https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/public/static/src/en/eatapplepies/icon.png'
          SOUSAKU_JS_URL='https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/.js/plugins/english/sousaku.js'
          SOUSAKU_ICON_URL='https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/public/static/src/en/sousaku/icon.svg'
          TSEIRP_JS_URL='https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/.js/plugins/english/tseirptranslations.js'
          TSEIRP_ICON_URL='https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/public/static/src/en/tseirptranslations/icon.svg'
          for FILE in .dist/plugins.json .dist/plugins.min.json; do
            sed -i "s#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/.js/src/plugins/english/eatapplepies.js#$EAP_JS_URL#g" "$FILE"
            sed -i "s#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/public/static/src/en/eatapplepies/icon.svg#$EAP_ICON_URL#g" "$FILE"
            sed -i "s#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/.js/src/plugins/english/sousaku.js#$SOUSAKU_JS_URL#g" "$FILE"
            sed -i "s#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/public/static/src/en/sousaku/icon.svg#$SOUSAKU_ICON_URL#g" "$FILE"
            sed -i "s#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/.js/src/plugins/english/tseirptranslations.js#$TSEIRP_JS_URL#g" "$FILE"
            sed -i "s#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/public/static/src/en/tseirptranslations/icon.svg#$TSEIRP_ICON_URL#g" "$FILE"
          done

      - name: Verify Azure Chronicles is absent
        working-directory: upstream
        run: |
          set -euo pipefail
          if grep -qi 'azurechronicles' .dist/plugins.json .dist/plugins.min.json; then
            echo 'ERROR: Azure Chronicles is still present in generated manifests.'
            exit 1
          fi

      - name: Verify EatApplePies icon
        working-directory: upstream
        run: |
          set -euo pipefail
          test -s public/static/src/en/eatapplepies/icon.png
          file public/static/src/en/eatapplepies/icon.png | grep -qi 'PNG image'
          grep -q 'public/static/src/en/eatapplepies/icon.png' .dist/plugins.json

      - name: Verify Sousaku plugin
        working-directory: upstream
        run: |
          set -euo pipefail
          test -s .js/plugins/english/sousaku.js
          test -s public/static/src/en/sousaku/icon.svg
          grep -Eq '"id"[[:space:]]*:[[:space:]]*"sousaku"' .dist/plugins.json
          grep -q 'public/static/src/en/sousaku/icon.svg' .dist/plugins.json
          grep -q 'version = '\''1.2.5'\''\|version: '\''1.2.5'\''' plugins/english/sousaku.ts .js/plugins/english/sousaku.js || true

      - name: Verify Tseirp Translations plugin
        working-directory: upstream
        run: |
          set -euo pipefail
          test -s .js/plugins/english/tseirptranslations.js
          test -s public/static/src/en/tseirptranslations/icon.svg
          grep -Eq '"id"[[:space:]]*:[[:space:]]*"tseirptranslations"' .dist/plugins.json
          grep -q 'public/static/src/en/tseirptranslations/icon.svg' .dist/plugins.json

      - name: Publish generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan publish
          git rm -rf . 2>/dev/null || true
          git add -f .js .dist public/static/src/en/eatapplepies public/static/src/en/sousaku public/static/src/en/tseirptranslations
          git commit -m "Build custom LNReader plugins"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:refs/heads/plugins/v3.0.0 --force
