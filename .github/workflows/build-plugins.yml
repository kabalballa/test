name: Build LNReader plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: lnreader/lnreader-plugins
          ref: master
          path: upstream
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install upstream build tooling
        working-directory: upstream
        run: npm ci

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Copy EatApplePies plugin into upstream tree
        run: |
          set -euo pipefail
          mkdir -p upstream/plugins/english
          EAP_SOURCE=$(find plugins/english -maxdepth 1 -type f -name 'eatapplepies*.ts' -print | sort | tail -n 1)
          test -n "$EAP_SOURCE"
          echo "Using EatApplePies source: $EAP_SOURCE"
          cp "$EAP_SOURCE" upstream/plugins/english/eatapplepies.ts
          mkdir -p upstream/public/static/src/en/eatapplepies
          test -f plugins/english/eatapplepies.svg
          convert plugins/english/eatapplepies.svg -background none -resize 512x512 upstream/public/static/src/en/eatapplepies/icon.png

      - name: Build plugin manifest
        working-directory: upstream
        run: |
          npm run build:compile
          npm run build:manifest

      - name: Fix EatApplePies URLs
        working-directory: upstream
        run: |
          set -euo pipefail
          EAP_JS_URL='https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/.js/plugins/english/eatapplepies.js'
          EAP_ICON_URL='https://raw.githubusercontent.com/kabalballa/test/plugins/v3.0.0/public/static/src/en/eatapplepies/icon.png'
          for FILE in .dist/plugins.json .dist/plugins.min.json; do
            sed -i "s#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/.js/src/plugins/english/eatapplepies.js#$EAP_JS_URL#g" "$FILE"
            sed -i "s#https://raw.githubusercontent.com/lnreader/lnreader-plugins/master/public/static/src/en/eatapplepies/icon.svg#$EAP_ICON_URL#g" "$FILE"
          done

      - name: Verify Azure Chronicles is absent
        working-directory: upstream
        run: |
          set -euo pipefail
          if grep -qi 'azurechronicles' .dist/plugins.json .dist/plugins.min.json; then
            echo 'ERROR: Azure Chronicles is still present in generated manifests.'
            exit 1
          fi

      - name: Verify EatApplePies icon
        working-directory: upstream
        run: |
          set -euo pipefail
          test -s public/static/src/en/eatapplepies/icon.png
          file public/static/src/en/eatapplepies/icon.png | grep -qi 'PNG image'
          grep -q 'public/static/src/en/eatapplepies/icon.png' .dist/plugins.json

      - name: Publish generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan publish
          git rm -rf . 2>/dev/null || true
          git add -f .js .dist public/static/src/en/eatapplepies
          git commit -m "Build EatApplePies plugin with PNG icon"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:refs/heads/plugins/v3.0.0 --force
